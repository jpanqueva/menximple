# Producción: todo en Docker, aislado. Qdrant SIN puerto al host (solo red interna);
# la API solo escucha en 127.0.0.1:${API_PORT} para que únicamente el nginx del host la
# alcance. El TLS y el path público /<prefijo>/api los da el nginx del host.
#   Uso:  docker compose -f docker-compose.prod.yml up -d --build
name: menximple

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage        # persistencia del único almacén

  api:
    build:
      context: .
      args:
        WITH_EMBEDDINGS: "false"            # embeddings off por ahora
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333        # red interna de compose
    ports:
      - "127.0.0.1:${API_PORT}:8000"        # SOLO local; nginx hace de proxy
    # Techo del api: el servidor es compartido. Van aquí y no con `docker update`
    # porque lo que se aplica en caliente se pierde en el siguiente --build.
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    depends_on:
      - qdrant
    volumes:
      - hf_cache:/home/app/.cache
      - archivos_data:/data/archivos        # archivos publicados (los bytes)

volumes:
  qdrant_data:
  hf_cache:
  archivos_data:
